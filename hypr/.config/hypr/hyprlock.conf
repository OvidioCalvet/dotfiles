# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

#BACKGROUND
background {
    monitor =
    path = ~/photos/wallpapers/cloud_sunset_background.png
    blur_passes = 3
    blur_size = 1
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgba(216, 222, 233, .80)
    font_size = 150
    font_family = Hack Nerd Font
    halign = center
    valign = center
    position = 0, 250
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.80)
    font_size = 70
    font_family = Hack Nerd Font
    halign = center
    valign = center
    position = 0, 0
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = Hack Nerd Font
    placeholder_text = <i><span foreground="##ffffff99"></span></i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
