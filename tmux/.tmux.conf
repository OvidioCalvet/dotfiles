# Basic options
set -g status-position top

tmux -f ~/.config/tmux/.tmux.conf


bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Bar location
set -g status-position top

### --- Rose Pine Vague Colors ---
set -g status-bg colour236        # bar background (dark base)
set -g status-fg colour244        # muted grey text
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify centre

### --- Window List on the Left ---
# Inactive windows: muted grey
set-window-option -g window-status-format "#[fg=colour244,bg=colour236] [#I] "
# Active window: pink number
set-window-option -g window-status-current-format "#[fg=colour181,bg=colour236,bold] [#I] "
# Remove names from list
set-window-option -g window-status-separator ""

# Show window list on left
set -g status-left "#{window-status}"

set -g status-left-length 80
set -g status-format[0] "#{window-status-format}#[align=centre]#[bg=colour181,fg=colour181,bold] #{window_name} #[align=right]#[fg=colour244] #S "
set -g status-left-style none
set -g status-right-style none
set-window-option -g window-status-current-format "#[fg=colour236,bg=colour181,bold] #W "
set-window-option -g window-status-format ""
set -g status-right "#[align=centre,bg=colour237,fg=colour181,bold] #{window_name} #[align=right,fg=colour244] #S "
