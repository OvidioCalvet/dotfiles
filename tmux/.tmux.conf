# Change prefix key to `
unbind C-b
set -g prefix `
bind ` send-prefix

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
 
# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000
 
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Status bar

set -g status on
set -g status-position bottom
set -g status-interval 3
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""

set -g status-left " #S │ "
set -g status-right " #([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) │ #(free | awk '/^Mem/{print int($3/$2*100)}')% │ #(date +%d) │ #(date +%H:%M) │ #(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'N/A')% "
